name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  #
  # Mo hinh KHONG duoc day len S3 o job nay. No duoc giu lai duoi dang artifact
  # cua GitHub Actions va chi duoc publish o Job 4, sau khi quality gate da qua.
  # Nho vay artifacts/current/model.joblib khong bao gio bi mot mo hinh yeu ghi de.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
      prev_f1: ${{ steps.prev_report.outputs.prev_f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # BONUS 4 - Doc report.json cua model DANG CHAY tren S3 de lat nua so sanh.
      # Phai doc TRUOC khi huan luyen vi Job 4 se ghi de file nay.
      - name: Read report of currently deployed model
        id: prev_report
        run: |
          if aws s3 cp "s3://${{ secrets.ARTIFACT_BUCKET }}/artifacts/current/report.json" /tmp/prev_report.json; then
            PREV=$(python -c "import json; print(json.load(open('/tmp/prev_report.json'))['f1_score'])")
            echo "Model dang chay tren VM co f1_score = $PREV"
          else
            PREV=""
            echo "Chua co report.json tren S3 - day la lan chay dau tien, bo qua so sanh."
          fi
          echo "prev_f1=$PREV" >> "$GITHUB_OUTPUT"

      # BONUS 1 - Ghi thi nghiem len MLflow tracking server tren DagsHub thay vi
      # file cuc bo trong runner (runner bi xoa sau moi lan chay).
      # Neu chua cau hinh secret thi buoc nay khong lam gi, pipeline van chay binh thuong.
      - name: Configure remote MLflow tracking (DagsHub)
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "Chua cau hinh MLFLOW_TRACKING_URI - MLflow ghi cuc bo trong runner."
            exit 0
          fi
          {
            echo "MLFLOW_TRACKING_URI=$MLFLOW_TRACKING_URI"
            echo "MLFLOW_TRACKING_USERNAME=$MLFLOW_TRACKING_USERNAME"
            echo "MLFLOW_TRACKING_PASSWORD=$MLFLOW_TRACKING_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "MLflow se ghi len tracking server tu xa."

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$F1" >> "$GITHUB_OUTPUT"

      # BONUS 3 - Luu ca report.json lan detail.txt (confusion matrix,
      # precision/recall tung lop) de tai ve doi chieu sau nay.
      - name: Save reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt

      - name: Save model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/model.joblib


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Hai chot chan truoc khi trien khai:
  #   1. Nguong tuyet doi : f1_score >= 0.65
  #   2. Nguong tuong doi : f1_score moi >= f1_score cua model dang chay (Bonus 4)
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        env:
          NEW_F1: ${{ needs.train.outputs.f1 }}
          PREV_F1: ${{ needs.train.outputs.prev_f1 }}
        run: |
          python - <<'PYEOF'
          import os

          f1 = float(os.environ["NEW_F1"])
          prev_raw = os.environ.get("PREV_F1", "").strip()

          # Chot 1: nguong chat luong tuyet doi.
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED (nguong tuyet doi): f1_score {f1:.4f} >= 0.65.")

          # Chot 2 (Bonus 4): khong trien khai model kem hon model dang chay.
          if prev_raw:
              prev = float(prev_raw)
              print(
                  f"So sanh voi model dang chay: moi {f1:.4f} vs cu {prev:.4f} "
                  f"(chenh lech {f1 - prev:+.4f})"
              )
              if f1 < prev:
                  raise SystemExit(
                      f"FAILED (rollback): f1_score moi {f1:.4f} thap hon model dang "
                      f"chay {prev:.4f}. Giu nguyen model cu, huy trien khai."
                  )
              print("PASSED (rollback): model moi khong kem hon model dang chay.")
          else:
              print("Chua co model tham chieu tren S3 - bo qua chot rollback.")

          print("Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Publish model da qua gate len S3, sau do restart service tren VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model
          path: models

      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: report
          path: outputs

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # report.json duoc publish cung model de lan chay sau doc lai lam moc so sanh.
      - name: Publish model to S3
        run: |
          aws s3 cp models/model.joblib "s3://${{ secrets.ARTIFACT_BUCKET }}/artifacts/current/model.joblib"
          aws s3 cp outputs/report.json "s3://${{ secrets.ARTIFACT_BUCKET }}/artifacts/current/report.json"

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            for attempt in 1 2 3 4 5; do
              if curl -sf http://localhost:8080/healthz; then
                echo "Health check passed."
                exit 0
              fi
              echo "Waiting for API (attempt $attempt/5)..."
              sleep 5
            done
            sudo systemctl status income-api --no-pager || true
            sudo journalctl -u income-api -n 50 --no-pager || true
            exit 1
